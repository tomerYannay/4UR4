name: Governance Validation

# Enforces the 4UR4 Agent Operating System on every change.
# Dependency-free: it only needs Node to run tools/validate.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent OS & governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run governance validator
        # Exits non-zero on any validation error, failing the workflow.
        run: node tools/validate.mjs

      - name: Run Bash safety hook tests
        # Exits non-zero on any failed assertion, failing the workflow.
        run: node .claude/hooks/bash-guard.test.mjs

      - name: Re-derive and re-check every golden fixture (as-of-time, §21/HD-12)
        # Replays all fixtures causally and asserts: exact 6-significant-figure
        # reproduction; the §21.4 hull lemma against the §8 brute force at every
        # evaluable prefix; prefix-truncation invariance (§21.8); the frozen-line
        # invariants (§21.5); and the formation-gate regressions (§21.3, D-TL-12).
        # Without this, the Phase-0 correctness contract is an author-run claim that
        # can silently drift — the exact failure Issue #16 exists to correct.
        run: node tools/fixture-replay.mjs --all

      - name: Validate fixture JSON against the schema, and documentation links
        run: node tools/check-evidence.mjs
